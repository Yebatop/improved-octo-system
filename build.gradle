plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

// The commit goes into the version (0.1.0+cc33fd6), so the jar's name, the log and the main menu tell builds apart.
def commit = ''
try {
    commit = providers.exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
} catch (Exception ignored) {
    // No git here: the plain version.
}
version = commit.isEmpty() ? project.mod_version : "${project.mod_version}+${commit}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def props = [
            version           : project.version,
            minecraft_version : project.minecraft_version,
            loader_min_version: project.loader_min_version
    ]
    inputs.properties props
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events = ["failed"]
        exceptionFormat = "full"
    }
}
